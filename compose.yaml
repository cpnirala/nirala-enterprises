name: nirala-enterprises
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nirala
      POSTGRES_USER: nirala
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python setup_local.py first}
    ports:
      - "127.0.0.1:5544:5432"
    volumes:
      - nirala_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nirala -d nirala"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
volumes:
  nirala_data:
